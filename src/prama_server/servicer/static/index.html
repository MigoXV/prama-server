<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prama ASR 评估服务</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel config-panel">
        <div class="section-title">
          <h1>Prama ASR 评估</h1>
          <span id="jobBadge" class="badge">未启动</span>
        </div>

        <form id="evaluationForm" class="form-grid">
          <label>
            <span>ASR gRPC 地址</span>
            <input name="target" value="192.168.1.24:50008" required />
          </label>
          <label>
            <span>数据集路径</span>
            <input name="dataset_path" value="data-bin/jacktol/ATC-ASR-Dataset" required />
          </label>
          <label>
            <span>Split</span>
            <input name="split" value="test" required />
          </label>
          <label>
            <span>Limit</span>
            <input name="limit" type="number" min="1" placeholder="不限制" />
          </label>
          <label>
            <span>语言</span>
            <input name="language_code" value="en-US" required />
          </label>
          <label>
            <span>采样率</span>
            <input name="sample_rate" type="number" min="1" value="16000" required />
          </label>
          <label>
            <span>最少参考词数</span>
            <input name="min_reference_words" type="number" min="0" value="5" required />
          </label>
          <label>
            <span>热词</span>
            <input name="hotwords" value="HOTEL" />
          </label>
          <label>
            <span>连接超时秒</span>
            <input name="connect_timeout_seconds" type="number" min="0.1" step="0.1" value="10" />
          </label>
          <label>
            <span>请求超时秒</span>
            <input name="request_timeout_seconds" type="number" min="0.1" step="0.1" value="60" required />
          </label>
          <button id="submitButton" type="submit">启动评估</button>
        </form>
      </section>

      <section class="panel status-panel">
        <div class="section-title">
          <h2>任务进度</h2>
          <span id="jobId" class="muted">-</span>
        </div>

        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="metric-grid">
          <div>
            <span>已处理</span>
            <strong id="processed">0 / 0</strong>
          </div>
          <div>
            <span>已评估</span>
            <strong id="evaluated">0</strong>
          </div>
          <div>
            <span>Final WER</span>
            <strong id="runningWer">-</strong>
          </div>
          <div>
            <span>Final CER</span>
            <strong id="runningCer">-</strong>
          </div>
          <div>
            <span>指标状态</span>
            <strong id="finalRates">-</strong>
          </div>
        </div>

        <div class="sample-block">
          <div class="sample-row">
            <span>当前样本</span>
            <strong id="currentId">-</strong>
          </div>
          <div class="sample-row">
            <span>Reference</span>
            <p id="reference">-</p>
          </div>
          <div class="sample-row">
            <span>Hypothesis</span>
            <p id="hypothesis">-</p>
          </div>
        </div>

        <div class="result-list">
          <div class="result-list-header">
            <h2>推理结果</h2>
          </div>
          <div class="result-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>序号</th>
                  <th>样本</th>
                  <th>Reference</th>
                  <th>Hypothesis</th>
                </tr>
              </thead>
              <tbody id="resultRows"></tbody>
            </table>
          </div>
        </div>

        <div class="report-panel">
          <div class="result-list-header">
            <h2>WER 对齐报告</h2>
          </div>
          <div id="reportSummary" class="report-summary"></div>
          <div id="reportUtterances" class="report-utterances"></div>
        </div>

        <pre id="errorBox" class="error-box" hidden></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
